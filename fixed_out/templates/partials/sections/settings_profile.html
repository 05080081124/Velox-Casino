    <div class="stab-p on" id="set-gen">
      <div class="set-grid">
        <!-- Редактирование профиля -->
        <div class="set-block">
          <div class="set-block-title">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M14.5 2.5a2.121 2.121 0 0 1 3 3L6 17H3v-3L14.5 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span id="set-edit-title">Редактировать профиль</span>
          </div>
          <div class="fg"><label id="set-uname-lbl">Имя пользователя</label><input type="text" class="inp" id="set-uname-inp" placeholder="Новое имя"></div>
          <!-- Валюта убрана из UI — задаётся языком интерфейса автоматически -->
          <input type="hidden" id="set-cur" value="UAH">
          <button class="btn-p w100" id="set-save-btn" onclick="V.saveProfile()">
            <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M4 10l5 5 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="set-save-btn-text">Сохранить изменения</span>
          </button>
        </div>

        <!-- Контактная информация -->
        <div class="set-block">
          <div class="set-block-title">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 7l8 5 8-5" stroke="currentColor" stroke-width="1.3"/></svg>
            <span id="set-contact-title">Контактная информация</span>
          </div>
          <div class="set-info-row">
            <span class="set-info-lbl">
              <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M2 7l8 5 8-5" stroke="currentColor" stroke-width="1.2"/></svg><span id="set-email-lbl">Почта</span>
            </span>
            <span class="set-info-val" id="set-email">—</span>
          </div>
          <div class="set-info-row">
            <span class="set-info-lbl">
              <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M4 2h4l1.5 4-2 1.5c1 2 2.5 3.5 4.5 4.5L13.5 10 17 11.5V15c0 1.1-.9 2-2 2C7.2 17 3 12.8 3 7.5A4.5 4.5 0 0 1 4 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span id="set-phone-lbl">Телефон</span>
            </span>
            <span class="set-info-val" id="set-phone">—</span>
          </div>
          <div class="set-info-row" style="border:none">
            <span class="set-info-lbl">
              <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M10 2l6 2.5V10c0 3.5-2.5 6.5-6 8-3.5-1.5-6-4.5-6-8V4.5L10 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span id="set-ver-lbl">Верификация</span>
            </span>
            <span id="set-ver" class="badge-pend">Ожидание</span>
          </div>
        </div>
      </div>

      <!-- Курсы валют -->
      <div class="set-block set-block--full" id="currency-rates-block" style="margin-top:12px">
        <div class="set-block-title">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v1.5M10 12.5V14M7.5 8.5C7.5 7.1 8.6 6 10 6s2.5 1.1 2.5 2.5c0 1.4-2.5 2-2.5 3.5 0 1.4 1.1 2.5 2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span id="set-rates-title">Курсы валют</span>
          <span id="rates-freshness-badge" style="margin-left:auto;font-size:11px;padding:2px 7px;border-radius:6px"></span>
        </div>
        <div id="rates-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px">
          <div class="rate-card" style="background:var(--bg2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--t2)">USD</div>
            <div style="font-size:18px;font-weight:600;color:var(--t1)" id="rate-usd">—</div>
            <div style="font-size:10px;color:var(--t3)" id="rate-usd-lbl">₴ за $1</div>
          </div>
          <div class="rate-card" style="background:var(--bg2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--t2)">EUR</div>
            <div style="font-size:18px;font-weight:600;color:var(--t1)" id="rate-eur">—</div>
            <div style="font-size:10px;color:var(--t3)" id="rate-eur-lbl">₴ за €1</div>
          </div>
          <div class="rate-card" style="background:var(--bg2);border-radius:8px;padding:10px 12px;text-align:center">
            <div style="font-size:11px;color:var(--t2)">USDT</div>
            <div style="font-size:18px;font-weight:600;color:var(--t1)" id="rate-usdt">—</div>
            <div style="font-size:10px;color:var(--t3)" id="rate-usdt-lbl">₴ за ₮1</div>
          </div>
        </div>
        <div id="rates-updated" style="font-size:11px;color:var(--t3);margin-top:8px;text-align:right"></div>
      </div>
    </div>
