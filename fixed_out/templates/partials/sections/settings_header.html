<!-- Hero профиля -->
  <div class="set-hero">
    <div class="set-hero-bg"></div>
    <div class="set-hero-inner">
      <div class="set-hero-av" id="set-hero-av" onclick="V.modal('avatar')" style="cursor:pointer" title="Изменить аватарку">V</div>
      <div class="set-hero-info">
        <div class="set-hero-name" id="set-uname">User</div>
        <div class="set-hero-meta" id="set-meta">—</div>
      </div>
    </div>
  </div>

  <!-- Быстрые статы -->
  <div class="set-stats-row" id="set-stats-row">
    <div class="set-stat">
      <div class="set-stat-ico">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="2" y="5" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 9h16" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="13" r="1.2" fill="currentColor"/></svg>
      </div>
      <div class="set-stat-val" id="set-stat-bal">—</div>
      <div class="set-stat-lbl" id="set-stat-lbl-balance">Баланс</div>
    </div>
    <div class="set-stat" id="set-stat-ver-card">
      <div class="set-stat-ico">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.47 5.01L18 8.18l-4 3.9.94 5.5L10 14.77l-4.94 2.81.94-5.5L2 8.18l5.53-.17L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div class="set-stat-val" id="set-stat-ver">—</div>
      <div class="set-stat-lbl" id="set-stat-lbl-verified">Верификация</div>
    </div>
    <div class="set-stat">
      <div class="set-stat-ico">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2a5 5 0 0 1 5 5c0 3.5-5 11-5 11S5 10.5 5 7a5 5 0 0 1 5-5z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="7" r="2" fill="currentColor"/></svg>
      </div>
      <div class="set-stat-val" id="set-stat-2fa">—</div>
      <div class="set-stat-lbl" id="set-stat-lbl-tfa">2FA</div>
    </div>
    <div class="set-stat">
      <div class="set-stat-ico">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div class="set-stat-val" id="set-stat-date">—</div>
      <div class="set-stat-lbl" id="set-stat-lbl-date">Дата регистрации</div>
    </div>
  </div>

  <!-- Таббар + контент -->
  <div class="set-wrap">
    <div class="stabs">
      <button class="stab on" id="stab-profile" onclick="V.stab(this,'set-gen')">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="stab-profile-lbl">Профіль</span>
      </button>
      <button class="stab" id="stab-security" onclick="V.stab(this,'set-sec')">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M10 2l6 2.5V10c0 3.5-2.5 6.5-6 8-3.5-1.5-6-4.5-6-8V4.5L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span id="stab-security-lbl">Безопасность</span>
      </button>
      <button class="stab" id="stab-history" onclick="V.stab(this,'set-hist');V.loadGameHistory()">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="stab-history-lbl" data-i18n="settings.tab_history">История</span>
      </button>
      <button class="stab" id="stab-policy" onclick="V.stab(this,'set-pol')">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><rect x="4" y="2" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span id="stab-policy-lbl">Политика</span>
      </button>
      <button class="stab" id="stab-tickets" onclick="V.stab(this,'set-tickets');V.loadMyTickets()">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M2 8a2 2 0 0 0 0 4v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2a2 2 0 0 0 0-4V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span id="stab-tickets-lbl">Тикеты</span>
      </button>
    </div>

    <!-- Вкладка: Профиль -->
