    <div class="stab-p" id="set-sec">

          <div class="set-block-title">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2l6 2.5V10c0 3.5-2.5 6.5-6 8-3.5-1.5-6-4.5-6-8V4.5L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>

          <div class="set-sep"></div>

            <div class="set-feature-body">
              <div class="set-feature-name" id="set-doc-ver-name">Верификация документов</div>

            </div>
            <button class="set-feature-btn" onclick="V.modal('verify')">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="set-sep"></div>

          <!-- Ответственная игра -->

            <div class="set-feature-ico" style="background:rgba(234,88,12,.15)">

              <div class="set-feature-name" id="set-rg-name">Ответственная игра</div>

            <button class="set-feature-btn" onclick="V.rgOpen()">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

          <div class="set-sep"></div>

          <!-- Реферальная программа -->
          <div class="set-feature-row">
            <div class="set-feature-ico" style="background:rgba(99,153,34,.15)">

            </div>
            <div class="set-feature-body">

            <button class="set-feature-btn" onclick="V.affOpen()">
              <svg width="11" height="11" viewBox="0 0 20 20" fill="none"><path d="M5 10h10M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

          </div>
