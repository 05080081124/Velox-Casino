{% extends "base.html" %}
{% from "macros.html" import sidebar, topbar %}
{% block title %}Team Chat — VELOX Support{% endblock %}
{% block page_id %}chat{% endblock %}

{% block body %}
<div class="panel-wrap">
  {{ sidebar('chat') }}
  <div class="panel-main" style="display:flex;flex-direction:column;height:100vh">
    {{ topbar('nav.chat', 'Team Chat') }}

    <!-- Chat area -->
    <div id="chat-messages"
         style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;
                flex-direction:column;gap:10px;background:var(--bg0)">
      <div class="loading-center"><span class="spinner"></span></div>
    </div>

    <!-- Attachment preview -->
    <div id="attach-preview" class="hidden"
         style="padding:8px 16px;background:var(--bg2);border-top:1px solid var(--bdr);
                display:flex;align-items:center;gap:10px">
      <span id="attach-name" style="font-size:12px;color:var(--t2);flex:1"></span>
      <button id="attach-remove"
              style="color:var(--red);font-size:18px;background:none;border:none;cursor:pointer">×</button>
    </div>

    <!-- Input bar -->
    <div class="chat-input-bar">
      <button id="attach-btn" class="chat-attach-btn" title="Attach file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="file-input" style="display:none"
             accept="image/*,video/*,audio/*,.pdf,.txt,.zip"/>
      <textarea id="chat-input" class="chat-textarea"
                placeholder="Message team... (Enter = send, Shift+Enter = new line)"
                rows="1"></textarea>
      <button id="chat-send" class="chat-send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>
{% endblock %}
